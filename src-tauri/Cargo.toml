[package]
name = "pharaoh"
version = "0.1.0"
description = "Pharaoh — AI-Powered Audio Drama Production Suite"
authors = ["MLTQ"]
edition = "2021"

[lib]
name = "pharaoh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pharaoh"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
csv = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
# Gruve share server: serves the built frontend + an HTTP mirror of the Tauri
# command surface so mesh viewers (no Tauri IPC) can use the app remotely.
axum = "0.8"
thiserror = "2"
hound = "3"
zip = { version = "2", features = ["deflate"] }
dirs = "5"
cpal = "0.15"
flacenc = "0.5.1"
claxon = "0.4.3"
futures-util = "0.3.34"
bytes = "1.12.1"

[target.'cfg(unix)'.dependencies]
# setrlimit (open-file limit for big scene renders) and statvfs (free disk
# before a rebuild). Already in the dependency tree via tokio/hound.
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
